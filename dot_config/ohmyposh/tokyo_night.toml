"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

[palette]
  bg      = '#1a1b26'
  fg      = '#c0caf5'
  blue    = '#7aa2f7'
  cyan    = '#7dcfff'
  purple  = '#9d7cd8'
  teal    = '#41a6b5'
  green   = '#9ece6a'
  yellow  = '#e0af68'
  red     = '#f7768e'
  magenta = '#bb9af7'
  orange  = '#ff9e64'

[transient_prompt]
  foreground = 'p:green'
  background = 'transparent'
  template = '❯ '

[upgrade]
  source = 'cdn'
  interval = "168h"
  auto = false
  notice = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    foreground = 'p:bg'
    background = 'p:blue'
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    background = 'p:cyan'
    foreground = 'p:bg'
    template = '  {{ path .Path .Location }} '
    powerline_symbol = ''
    type = 'path'
    style = 'powerline'

    [blocks.segments.options]
      style = 'full'

  [[blocks.segments]]
    template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
    foreground = 'p:bg'
    powerline_symbol = ''
    background = 'p:green'
    type = 'git'
    style = 'powerline'
    background_templates = [
      '{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}',
      '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}',
      '{{ if gt .Ahead 0 }}p:teal{{ end }}',
      '{{ if gt .Behind 0 }}p:purple{{ end }}',
    ]

    [blocks.segments.options]
      branch_icon = ' '
      branch_template = '{{ trunc 25 .Branch }}'
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    leading_diamond = '<transparent,background></>'
    trailing_diamond = ''
    template = ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
    foreground = 'p:bg'
    background = 'p:green'
    type = 'status'
    style = 'diamond'
    background_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']

    [blocks.segments.options]
      always_enabled = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '❯'
    foreground = 'p:green'
    foreground_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']
    background = 'transparent'
    type = 'status'
    style = 'plain'

    [blocks.segments.options]
      always_enabled = true
